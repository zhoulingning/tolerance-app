    // ----- Messages (errors / warnings) -----

    function setMessages(list) {
      messages = list;
      showMessages();
    }

    function showMessages() {
      document.getElementById("messages").innerHTML = messages
        .map(m => `<div class="${m.type}">${esc(t(m.key, ...m.args))}</div>`).join("");
    }

    // =====================================================================
    // 2D GEOMETRY HELPERS
    // =====================================================================
    //
    // A "transform" moves a point: first rotate it, then shift it.
    //   new.x = c * x − s * y + tx
    //   new.y = s * x + c * y + ty      (c = cos(angle), s = sin(angle))

    const IDENTITY = { c: 1, s: 0, tx: 0, ty: 0 };   // a transform that moves nothing
    const ZERO = { x: 0, y: 0 };

    function apply(T, p) {
      return { x: T.c * p.x - T.s * p.y + T.tx, y: T.s * p.x + T.c * p.y + T.ty };
    }

    // compose(A, B) = "do B first, then A".
    function compose(A, B) {
      return {
        c: A.c * B.c - A.s * B.s,
        s: A.s * B.c + A.c * B.s,
        tx: A.c * B.tx - A.s * B.ty + A.tx,
        ty: A.s * B.tx + A.c * B.ty + A.ty
      };
    }

    // Rotates by `angle` around `from`, and moves `from` to `to`.
    function rotateMove(angle, from, to) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return { c, s, tx: to.x - (c * from.x - s * from.y), ty: to.y - (s * from.x + c * from.y) };
    }

    // The angle (in radians) needed to turn direction u into direction v.
    function angleBetween(u, v) {
      return Math.atan2(u.x * v.y - u.y * v.x, u.x * v.x + u.y * v.y);
    }

    // =====================================================================
    // THE ENGINE: one virtual assembly
    // =====================================================================
    //
    // evaluate() builds ONE assembly and returns, for every check, how far the
    // "To" feature moved relative to the "From" feature: { x, y }.
    //
    // All random numbers come from `rnd`. This trick lets the same code do two jobs:
    //   - Monte Carlo:  rnd gives real random numbers           (makeRandomRnd)
    //   - Sensitivity:  rnd gives 0, except one tiny test value (makeSenseRnd)

    // Where feature f really is, in its own item's nominal position.
    function featureActual(f, rnd) {
      const pos = rnd.pos2(f.id + ":pos", f.tp / 2);    // ⌀ position: radius = tp / 2
      return {
        x: f.x + rnd.normal(f.id + ":x", f.tolX) + pos.x,
        y: f.y + rnd.normal(f.id + ":y", f.tolY) + pos.y
      };
    }

    // Clearance between a hole and a pin: hole Ø − pin Ø (never below 0).
    function clearance(a, b, rnd) {
      const hole = a.kind === "hole" ? a : b;
      const pin = hole === a ? b : a;
      const now = rnd.size(hole.id + ":d", hole.d, hole.dTol) - rnd.size(pin.id + ":d", pin.d, pin.dTol);
      const max = (hole.d + hole.dTol) - (pin.d - pin.dTol);
      return { now: Math.max(0, now), max: Math.max(0, max) };
    }

    // Two-pin locating. Returns the transform that moves the item from its
    // nominal position to where it really sits on its parent.
    function locateTwoPin(item, m, rnd) {
      const L = item.locate;
      const fP1 = m.feat[L.p1].f, fP2 = m.feat[L.p2].f;   // on the parent
      const fH1 = m.feat[L.h1].f, fH2 = m.feat[L.h2].f;   // on this item
      const P1 = featureActual(fP1, rnd), P2 = featureActual(fP2, rnd);
      const H1 = featureActual(fH1, rnd), H2 = featureActual(fH2, rnd);

      let float1 = ZERO;   // how far hole 1 sits from pin 1 (any direction)
      let float2 = 0;      // how far hole 2 sits sideways from pin 2
      if (L.mode === "free") {
        const c1 = clearance(fP1, fH1, rnd);
        const c2 = clearance(fP2, fH2, rnd);
        float1 = rnd.disk(item.id + ":float1", c1.now / 2, c1.max / 2);
        float2 = rnd.uniform(item.id + ":float2", c2.now / 2, c2.max / 2);
      }

      // Hole 1 lands on pin 1 (plus float).
      const base = { x: P1.x + float1.x, y: P1.y + float1.y };
      // Hole 2 lands on pin 2, shifted sideways (perpendicular to the pin line) by float2.
      const line = { x: P2.x - P1.x, y: P2.y - P1.y };
      const len = Math.hypot(line.x, line.y);
      const side = { x: -line.y / len, y: line.x / len };
      const target = { x: P2.x + side.x * float2 - base.x, y: P2.y + side.y * float2 - base.y };
      // Turn the item so that hole1 → hole2 points at that target.
      const angle = angleBetween({ x: H2.x - H1.x, y: H2.y - H1.y }, target);
      return rotateMove(angle, H1, base);
    }

    // Known relative tolerance: random ±dX, ±dY, ±θ around a reference point.
    function locateKnown(item, m, rnd) {
      const L = item.locate;
      const pivot = m.feat[L.pivot].f;
      const dx = rnd.normal(item.id + ":kx", L.tx);
      const dy = rnd.normal(item.id + ":ky", L.ty);
      const angle = rnd.normal(item.id + ":kt", L.tt * Math.PI / 180);  // degrees → radians
      return rotateMove(angle, pivot, { x: pivot.x + dx, y: pivot.y + dy });
    }

    function centroid(points) {
      let x = 0, y = 0;
      for (const p of points) { x += p.x; y += p.y; }
      return { x: x / points.length, y: y / points.length };
    }

    // Least-squares best fit: the turn + shift that brings all holes H as close as
    // possible to their pins P at once. (Center on center, then the best angle.)
    function bestFit(H, P) {
      const hc = centroid(H), pc = centroid(P);
      let cross = 0, dot = 0;
      H.forEach((h, i) => {
        const a = { x: h.x - hc.x, y: h.y - hc.y };
        const b = { x: P[i].x - pc.x, y: P[i].y - pc.y };
        cross += a.x * b.y - a.y * b.x;
        dot += a.x * b.x + a.y * b.y;
      });
      return rotateMove(Math.atan2(cross, dot), hc, pc);
    }

    // Free pin pattern. After the best fit the part can still move a little: a shift
    // (x, y) and a small turn t, as long as every hole stays within its clearance r[i]
    // of its pin. floatRegion() describes all those allowed moves.
    function floatRegion(placed, P, r, center) {
      const e = placed.map((h, i) => ({ x: h.x - P[i].x, y: h.y - P[i].y }));  // left-over offsets
      const rel = placed.map(h => ({ x: h.x - center.x, y: h.y - center.y }));
      // A box that surely contains every allowed move: the shift is the average hole
      // movement, and the turn is a distance-weighted average, so neither can be
      // bigger than what the holes allow.
      let dMax = 0, num = 0, den = 0;
      e.forEach((ei, i) => {
        const limit = r[i] + Math.hypot(ei.x, ei.y);
        const dist = Math.hypot(rel[i].x, rel[i].y);
        dMax = Math.max(dMax, limit);
        num += dist * limit;
        den += dist * dist;
      });
      const tMax = den > 0 ? num / den : 0;
      // Does a move keep every hole within its clearance? (A small turn t moves a
      // hole by t × its distance from the center, at right angles.)
      const fits = mv => e.every((ei, i) => {
        const mx = ei.x + mv.x - mv.t * rel[i].y;
        const my = ei.y + mv.y + mv.t * rel[i].x;
        return mx * mx + my * my <= r[i] * r[i];
      });
      // A random allowed move: try random moves in the box, keep the first that fits.
      const sample = () => {
        if (Math.min(...r) > 0) {
          for (let tries = 0; tries < 1000; tries++) {
            const mv = { x: (2 * Math.random() - 1) * dMax, y: (2 * Math.random() - 1) * dMax,
                         t: (2 * Math.random() - 1) * tMax };
            if (fits(mv)) return mv;
          }
        }
        return { x: 0, y: 0, t: 0 };   // no room to move: the part stays at the best fit
      };
      return { fits, sample, dMax, tMax };
    }

    // Pin pattern locating: best fit through all pairs, plus a random float if free.
    function locatePattern(item, m, rnd) {
      const pairs = m.pairs[item.id];
      const P = pairs.map(pr => featureActual(pr.fP, rnd));   // on the parent
      const H = pairs.map(pr => featureActual(pr.fH, rnd));   // on this item
      const best = bestFit(H, P);
      if (item.locate.mode !== "free") return best;

      const c = pairs.map(pr => clearance(pr.fP, pr.fH, rnd));
      const placed = H.map(h => apply(best, h));
      const center = centroid(P);
      const float = rnd.float(item.id + ":float",
        radii => floatRegion(placed, P, radii, center),
        c.map(ci => ci.now / 2), c.map(ci => ci.max / 2));
      const F = rotateMove(float.t, center, { x: center.x + float.x, y: center.y + float.y });
      return compose(F, best);
    }

    // "+x" → (1, 0), "-y" → (0, −1), and so on.
    function dirVec(d) {
      return { "+x": { x: 1, y: 0 }, "-x": { x: -1, y: 0 }, "+y": { x: 0, y: 1 }, "-y": { x: 0, y: -1 } }[d];
    }

    // Where a stop really touches. The part is pushed in direction n, so the stop is
    // ahead of it: a pin stop touches with its near side (center − n × radius).
    function stopContact(f, actual, n, rnd) {
      if (f.kind !== "pin") return actual;
      const radius = f.d / 2 + rnd.normal(f.id + ":r", f.dTol / 2);
      return { x: actual.x - n.x * radius, y: actual.y - n.y * radius };
    }

    // Solves 3 equations with 3 unknowns (Cramer's rule).
    function solve3(A, b) {
      const det = M => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
                     - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
                     + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
      const D = det(A);
      return [0, 1, 2].map(col => det(A.map((row, i) => row.map((v, j) => j === col ? b[i] : v))) / D);
    }

    // Edge stops (2 + 1): find the small shift (dx, dy) and turn t that makes each edge
    // point touch its stop. For each stop, along its push direction n:
    //   n · (edge point + shift + turn effect − contact point) = 0
    // Three stops give three equations for the three unknowns.
    function locateStops(item, m, rnd) {
      const L = item.locate;
      const n1 = dirVec(L.n1), n2 = dirVec(L.n2);
      const stops = [[L.s1p, L.s1h, n1], [L.s2p, L.s2h, n1], [L.s3p, L.s3h, n2]].map(([p, h, n]) => {
        const fP = m.feat[p].f, fH = m.feat[h].f;
        return { C: stopContact(fP, featureActual(fP, rnd), n, rnd), H: featureActual(fH, rnd), n };
      });
      const ref = stops[0].H;   // turn around the first edge point
      // A small turn t moves a point by t × (−(y − ref.y), x − ref.x).
      const A = stops.map(({ H, n }) => [n.x, n.y, -n.x * (H.y - ref.y) + n.y * (H.x - ref.x)]);
      const b = stops.map(({ H, C, n }) => n.x * (C.x - H.x) + n.y * (C.y - H.y));
      const [dx, dy, turn] = solve3(A, b);
      return rotateMove(turn, ref, { x: ref.x + dx, y: ref.y + dy });
    }

    // Pocket: the allowed moves of a rectangle (half sizes a in X, b in Y) inside a pocket
    // with total clearances c.x, c.y. A corner stays inside when
    //   |shift x| + |turn| · b ≤ c.x / 2   and   |shift y| + |turn| · a ≤ c.y / 2.
    function pocketRegion(c, a, b) {
      const hx = c.x / 2, hy = c.y / 2;
      const tMax = Math.min(hx / b, hy / a);
      const fits = mv => Math.abs(mv.x) + Math.abs(mv.t) * b <= hx &&
                         Math.abs(mv.y) + Math.abs(mv.t) * a <= hy;
      const sample = () => {
        if (hx > 0 && hy > 0) {
          for (let tries = 0; tries < 1000; tries++) {
            const mv = { x: (2 * Math.random() - 1) * hx, y: (2 * Math.random() - 1) * hy,
                         t: (2 * Math.random() - 1) * tMax };
            if (fits(mv)) return mv;
          }
        }
        return { x: 0, y: 0, t: 0 };
      };
      return { fits, sample, dMax: Math.max(hx, hy), tMax };
    }

    function locatePocket(item, m, rnd) {
      const L = item.locate;
      const C = featureActual(m.feat[L.pc].f, rnd);   // pocket center, on the parent
      const Q = featureActual(m.feat[L.hc].f, rnd);   // part center, on this item
      const now = { x: Math.max(0, rnd.size(item.id + ":cx", L.cx, L.cxTol)),
                    y: Math.max(0, rnd.size(item.id + ":cy", L.cy, L.cyTol)) };
      const max = { x: L.cx + L.cxTol, y: L.cy + L.cyTol };
      const float = rnd.float(item.id + ":float", c => pocketRegion(c, L.pw / 2, L.ph / 2), now, max);
      return rotateMove(float.t, Q, { x: C.x + float.x, y: C.y + float.y });
    }

    function evaluate(m, rnd) {
      // 1. Position every item, parents first. world[id] moves the item's nominal
      //    points to where they really are in the finished assembly.
      const world = {};
      for (const item of m.order) {
        if (item.parent === null) { world[item.id] = IDENTITY; continue; }
        const method = item.locate.method;
        const L = method === "known" ? locateKnown(item, m, rnd)
                : method === "pattern" ? locatePattern(item, m, rnd)
                : method === "stops" ? locateStops(item, m, rnd)
                : method === "pocket" ? locatePocket(item, m, rnd)
                : locateTwoPin(item, m, rnd);
        world[item.id] = compose(world[item.parent], L);
      }
      // 2. Measure every check: real (Q − P) minus nominal (Q − P).
      return m.checks.map(ch => {
        // Fit: for every hole/pin pair, margin = clearance / 2 − how far apart the centers
        // are. The smallest margin decides: below 0 means a pin hits its hole wall.
        if (ch.measure === "fit") {
          let fit = Infinity;
          for (const { fA, fB, itemA, itemB } of m.fits[ch.id]) {
            const A = apply(world[itemA.id], featureActual(fA, rnd));
            const B = apply(world[itemB.id], featureActual(fB, rnd));
            const offset = Math.hypot(A.x - B.x - (fA.x - fB.x), A.y - B.y - (fA.y - fB.y));
            fit = Math.min(fit, clearance(fA, fB, rnd).now / 2 - offset);
          }
          return { x: 0, y: 0, fit };
        }
        const p = m.feat[ch.p], q = m.feat[ch.q];
        const P = apply(world[p.item.id], featureActual(p.f, rnd));
        const Q = apply(world[q.item.id], featureActual(q.f, rnd));
        return { x: (Q.x - P.x) - (q.f.x - p.f.x), y: (Q.y - P.y) - (q.f.y - p.f.y) };
      });
    }

    // =====================================================================
    // RANDOM NUMBERS
    // =====================================================================

    // Box-Muller: one bell-curve number with average 0 and σ = 1 (from stackup.html).
    function randomNormal() {
      let u = 0;
      while (u === 0) u = Math.random();
      const v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    // Real random numbers for Monte Carlo. k = 3 or 6 (tolerance = ±kσ).
    // Each key is drawn once per assembly and then remembered ("memo"), so a pin
    // used in two places has the same error in both.
    function makeRandomRnd(k) {
      const cache = new Map();
      const memo = (key, make) => {
        if (!cache.has(key)) cache.set(key, make());
        return cache.get(key);
      };
      return {
        newRun() { cache.clear(); },
        normal(key, T) { return T ? memo(key, () => T / k * randomNormal()) : 0; },
        pos2(key, R) {
          return R ? memo(key, () => ({ x: R / k * randomNormal(), y: R / k * randomNormal() })) : ZERO;
        },
        disk(key, R) {   // a random point anywhere inside a circle of radius R
          return R > 0 ? memo(key, () => {
            const r = R * Math.sqrt(Math.random()), a = 2 * Math.PI * Math.random();
            return { x: r * Math.cos(a), y: r * Math.sin(a) };
          }) : ZERO;
        },
        uniform(key, R) { return R > 0 ? memo(key, () => (2 * Math.random() - 1) * R) : 0; },
        size(key, nominal, T) { return T ? memo(key, () => nominal + T / k * randomNormal()) : nominal; },
        // Free pin pattern or pocket: one random allowed move.
        float(key, makeRegion, rNow) { return memo(key, () => makeRegion(rNow).sample()); }
      };
    }

    // Sensitivity mode: every random value is 0, except `target`, which gets `h`.
    // While doing this it also records every contributor in `meta`:
    //   wc    - its worst-case size
    //   sigma - its standard deviation
    //   type  - "1d" (one number) or "2d" (a direction-free x/y pair)
    function makeSenseRnd(target, h, meta, k) {
      const register = (key, type, wc, sigma) => {
        if (meta && wc > 0 && !meta.has(key)) meta.set(key, { type, wc, sigma });
      };
      const one = key => key === target ? h : 0;
      const two = key => ({ x: one(key + ":x"), y: one(key + ":y") });
      return {
        normal(key, T) { register(key, "1d", T, T / k); return one(key); },
        pos2(key, R) { register(key, "2d", R, R / k); return two(key); },
        // Uniform in a circle: σ in each direction = R / 2. Worst case uses the largest clearance.
        disk(key, R, Rmax) { register(key, "2d", Rmax, R / 2); return two(key); },
        // Uniform from −R to +R: σ = R / √3.
        uniform(key, R, Rmax) { register(key, "1d", Rmax, R / Math.sqrt(3)); return one(key); },
        size(key, nominal) { return nominal; },
        // Free pin pattern or pocket: the allowed moves have no simple formula, so we keep
        // 2000 random allowed moves (at nominal and at largest clearance) to measure on.
        float(key, makeRegion, rNow, rMax) {
          if (meta && !meta.has(key)) {
            const widest = makeRegion(rMax);
            const many = region => Array.from({ length: 2000 }, () => region.sample());
            meta.set(key, { type: "region", region: widest, samplesMax: many(widest),
                            samplesNow: many(makeRegion(rNow)) });
          }
          return { x: one(key + ":x"), y: one(key + ":y"), t: one(key + ":t") };
        }
      };
    }

    // =====================================================================
    // WORST CASE + RSS (from sensitivities)
    // =====================================================================
    //
    // For each contributor: nudge it by a tiny amount h and see how much each
    // check moves. That ratio is the "sensitivity" J. Then:
    //   Worst case = Σ |J| × worst-case size
    //   RSS        = k × √( Σ (J × σ)² )
    // The largest value of g over all allowed pattern-float moves. Start from the best
    // random sample, then keep taking small random steps that stay allowed and raise g.
    function regionMax(region, samples, g) {
      let best = { x: 0, y: 0, t: 0 };
      for (const s of samples) if (g(s) > g(best)) best = s;
      let step = 0.2;
      for (let i = 0; i < 2000; i++) {
        const mv = { x: best.x + step * region.dMax * (2 * Math.random() - 1),
                     y: best.y + step * region.dMax * (2 * Math.random() - 1),
                     t: best.t + step * region.tMax * (2 * Math.random() - 1) };
        if (g(mv) > g(best) && region.fits(mv)) best = mv;
        if (i % 250 === 249) step /= 2;
      }
      return g(best);   // the allowed moves are symmetric, so this is also the largest |g|
    }

    function sensitivity(m, k) {
      const h = 1e-4;
      const meta = new Map();
      evaluate(m, makeSenseRnd(null, 0, meta, k));   // first pass: just list the contributors

      // contrib[i] = list of { key, wx, wy, vx, vy }: each contributor's worst case (w)
      // and variance (v) in X and Y for check i.
      const contrib = m.checks.map(() => []);

      for (const [key, info] of meta) {
        const targets = info.type === "region" ? [key + ":x", key + ":y", key + ":t"]
                      : info.type === "2d" ? [key + ":x", key + ":y"] : [key];
        // J[t][i] = how check i moves when target t moves by 1
        const J = targets.map(target => {
          const plus = evaluate(m, makeSenseRnd(target, h, null, k));
          const minus = evaluate(m, makeSenseRnd(target, -h, null, k));
          return plus.map((p, i) => ({ x: (p.x - minus[i].x) / (2 * h), y: (p.y - minus[i].y) / (2 * h) }));
        });
        m.checks.forEach((ch, i) => {
          const c = { key, wx: 0, wy: 0, vx: 0, vy: 0 };
          for (const axis of ["x", "y"]) {
            const Jv = J.map(j => j[i][axis]);
            if (Jv.every(v => v === 0)) continue;   // this contributor doesn't move this check
            let w, v;
            if (info.type === "region") {
              // g = how far this check moves for one allowed float move (x, y, t)
              const g = s => Jv[0] * s.x + Jv[1] * s.y + Jv[2] * s.t;
              w = regionMax(info.region, info.samplesMax, g);
              v = info.samplesNow.reduce((sum, s) => sum + g(s) ** 2, 0) / info.samplesNow.length;
            } else {
              // For a 2D contributor the worst direction gives √(Jx² + Jy²).
              const g = Math.hypot(...Jv);
              w = info.wc * g;
              v = (info.sigma * g) ** 2;
            }
            c["w" + axis] = w;
            c["v" + axis] = v;
          }
          if (c.wx || c.wy) contrib[i].push(c);
        });
      }
      // RSS is capped at the worst case: with few contributors (especially uniform
      // pin float) ±kσ can reach past what is physically possible.
      return m.checks.map((ch, i) => {
        const sum = field => contrib[i].reduce((s, c) => s + c[field], 0);
        const wcX = sum("wx"), wcY = sum("wy");
        return {
          wcX, wcY,
          rssX: Math.min(wcX, k * Math.sqrt(sum("vx"))),
          rssY: Math.min(wcY, k * Math.sqrt(sum("vy"))),
          contrib: contrib[i]
        };
      });
    }

    // =====================================================================
    // CHECKING THE INPUT, THEN CALCULATING
    // =====================================================================

    // Checks the model for mistakes and prepares it for the engine.
    function buildModel() {
      const errors = [], warnings = [];
      const err = (key, ...args) => errors.push({ type: "error", key, args });
      const warn = (key, ...args) => warnings.push({ type: "warning", key, args });

      // Features by id, with the item they belong to.
      const feat = {};
      for (const item of model.items) for (const f of item.features) feat[f.id] = { f, item };

      // Exactly one base item, and every item must chain back to it.
      const roots = model.items.filter(item => item.parent === null);
      if (roots.length !== 1) err("errRoot");
      const order = [];
      const visit = item => {
        order.push(item);
        model.items.filter(c => c.parent === item.id && !order.includes(c)).forEach(visit);
      };
      if (roots.length === 1) visit(roots[0]);
      for (const item of model.items) {
        if (roots.length === 1 && !order.includes(item)) err("errUnreached", item.name);
      }

      // Each item's locating features.
      const pairsById = {};   // pin pattern pairs, per item
      for (const item of model.items) {
        if (item.parent === null) continue;
        const L = item.locate;
        const onParent = id => feat[id] && feat[id].item.id === item.parent;
        const onSelf = id => feat[id] && feat[id].item.id === item.id;
        if (L.method === "known") {
          if (!onSelf(L.pivot)) err("errPivot", item.name);
          continue;
        }
        if (L.method === "pattern") {
          const pairs = patternPairs(item, itemById(item.parent));
          if (pairs.length < 2) { err("errPattern", item.name); continue; }
          pairsById[item.id] = pairs.map(pr => ({ fP: feat[pr.p].f, fH: feat[pr.h].f }));
          const tooBig = pairsById[item.id].find(({ fP, fH }) =>
            (fH.kind === "hole" ? fH.d - fP.d : fP.d - fH.d) < 0);
          if (L.mode === "free" && tooBig) warn("warnInterference", item.name, tooBig.fH.name, tooBig.fP.name);
          continue;
        }
        if (L.method === "stops") {
          const rows = [[L.s1p, L.s1h], [L.s2p, L.s2h], [L.s3p, L.s3h]];
          if (rows.some(([p, h]) => !onParent(p) || !onSelf(h))) { err("errStops", item.name); continue; }
          const n1 = dirVec(L.n1), n2 = dirVec(L.n2);
          if (n1.x * n2.x + n1.y * n2.y !== 0) { err("errStopsDir", item.name); continue; }
          // Stops 1 and 2 must be apart along their edge, or they can't stop the turn.
          const E1 = feat[L.s1h].f, E2 = feat[L.s2h].f;
          if (Math.abs(-(E2.x - E1.x) * n1.y + (E2.y - E1.y) * n1.x) < 1e-6) {
            err("errStopsSpread", item.name);
            continue;
          }
          // At nominal size each edge point should touch its stop.
          rows.forEach(([p, h], i) => {
            const n = i < 2 ? n1 : n2, S = feat[p].f, E = feat[h].f;
            const C = S.kind === "pin" ? { x: S.x - n.x * S.d / 2, y: S.y - n.y * S.d / 2 } : S;
            if (Math.abs(n.x * (E.x - C.x) + n.y * (E.y - C.y)) > 1e-6) warn("warnStopNominal", item.name, E.name);
          });
          continue;
        }
        if (L.method === "pocket") {
          if (!onParent(L.pc) || !onSelf(L.hc) || !(L.pw > 0) || !(L.ph > 0)) { err("errPocket", item.name); continue; }
          const C = feat[L.pc].f, Q = feat[L.hc].f;
          if (Math.hypot(C.x - Q.x, C.y - Q.y) > 1e-6) warn("warnPocketNominal", item.name);
          continue;
        }
        if (!onParent(L.p1) || !onParent(L.p2) || !onSelf(L.h1) || !onSelf(L.h2) ||
            L.p1 === L.p2 || L.h1 === L.h2) {
          err("errPins", item.name);
          continue;
        }
        const P1 = feat[L.p1].f, P2 = feat[L.p2].f, H1 = feat[L.h1].f, H2 = feat[L.h2].f;
        if (Math.hypot(P2.x - P1.x, P2.y - P1.y) < 1e-9) err("errPinsSame", item.name);
        if (L.mode === "free") {
          for (const [a, b] of [[P1, H1], [P2, H2]]) {
            if ([a.kind, b.kind].sort().join() !== "hole,pin") {
              err("errFreeKinds", item.name, a.name, b.name);
            } else {
              const hole = a.kind === "hole" ? a : b, pin = hole === a ? b : a;
              if (hole.d < pin.d) warn("warnInterference", item.name, a.name, b.name);
            }
          }
        }
        if (Math.hypot(P1.x - H1.x, P1.y - H1.y) > 1e-6 || Math.hypot(P2.x - H2.x, P2.y - H2.y) > 1e-6) {
          warn("warnNominal", item.name);
        }
      }

      // Checks.
      if (model.checks.length === 0) err("errNoChecks");
      const fits = {};   // fit check pairs, per check
      for (const ch of model.checks) {
        if (ch.measure === "fit") {
          fits[ch.id] = fitPairs(ch);
          if (!ch.q || fits[ch.id].length === 0) err("errFit", ch.name);
          continue;
        }
        if (!feat[ch.p] || !feat[ch.q]) err("errCheckFeatures", ch.name);
        if (ch.measure !== "radial" && ch.min !== null && ch.max !== null && ch.min > ch.max) {
          err("errCheckSpec", ch.name);
        }
      }
      return { errors, warnings, m: { order, feat, checks: model.checks, pairs: pairsById, fits } };
    }

    // The nominal value of a check (what it is with no errors at all).
    function nominalValue(ch, m) {
      if (ch.measure === "fit") {   // the smallest nominal clearance / 2
        return Math.min(...m.fits[ch.id].map(({ fA, fB }) =>
          (fA.kind === "hole" ? fA.d - fB.d : fB.d - fA.d) / 2));
      }
      const p = m.feat[ch.p].f, q = m.feat[ch.q].f;
      if (ch.measure === "dx") return q.x - p.x;
      if (ch.measure === "dy") return q.y - p.y;
      return 0;   // radial offset
    }

    // Turns a check's movement { x, y } into the number we measure.
    function measureValue(ch, d, nominal) {
      if (ch.measure === "fit") return d.fit;
      if (ch.measure === "dx") return nominal + d.x;
      if (ch.measure === "dy") return nominal + d.y;
      return Math.hypot(d.x, d.y);
    }

    // Returns every check's measured values, plus the raw (ΔX, ΔY) of radial checks
    // for the scatter plot.
    function monteCarlo(m, runs, k) {
      const rnd = makeRandomRnd(k);
      const nominals = m.checks.map(ch => nominalValue(ch, m));
      const values = m.checks.map(() => new Float64Array(runs));
      const xy = m.checks.map(ch => ch.measure === "radial"
        ? { x: new Float64Array(runs), y: new Float64Array(runs) } : null);
      for (let r = 0; r < runs; r++) {            // one loop = one virtual assembly
        rnd.newRun();
        const d = evaluate(m, rnd);
        m.checks.forEach((ch, i) => {
          values[i][r] = measureValue(ch, d[i], nominals[i]);
          if (xy[i]) { xy[i].x[r] = d[i].x; xy[i].y[r] = d[i].y; }
        });
      }
      return { values, xy };
    }

    // Runs when the "Calculate" button is clicked.
    function calculate() {
      const runs = Number(document.getElementById("runs").value);
      if (!Number.isInteger(runs) || runs < 100 || runs > 1000000) {
        setMessages([{ type: "error", key: "errRuns", args: [] }]);
        return;
      }
      const k = Number(document.getElementById("sigmaLevel").value);
      const { errors, warnings, m } = buildModel();
      if (errors.length) {
        setMessages(errors.concat(warnings));
        return;
      }
      setMessages(warnings.concat([{ type: "info", key: "calculating", args: [] }]));

      // setTimeout lets the page show "Calculating…" before the heavy work starts.
      setTimeout(() => {
        const sens = sensitivity(m, k);
        const { values, xy } = monteCarlo(m, runs, k);
        lastResults = {
          runs, k,
          checks: m.checks.map((ch, i) => {
            // A radial offset only has a maximum; a fit margin only has a minimum.
            const min = ch.measure === "radial" ? null : ch.min;
            const max = ch.measure === "fit" ? null : ch.max;
            const useY = ch.measure === "dy";
            return {
              name: ch.name, measure: ch.measure, min, max,
              nominal: nominalValue(ch, m),
              wc: useY ? sens[i].wcY : sens[i].wcX,
              rss: useY ? sens[i].rssY : sens[i].rssX,
              contrib: sens[i].contrib,
              values: values[i], xy: xy[i],
              stats: summarize(values[i], min, max)
            };
          })
        };
        setMessages(warnings);
        renderResults();
      }, 20);
    }

    // =====================================================================
    // RESULTS (same formulas and layout as stackup.html)
    // =====================================================================

    function summarize(values, specMin, specMax) {
      let sum = 0, min = Infinity, max = -Infinity, below = 0, above = 0;
      for (const v of values) {
        sum += v;
        if (v < min) min = v;
        if (v > max) max = v;
        if (specMin !== null && v < specMin) below++;
        if (specMax !== null && v > specMax) above++;
      }
      const mean = sum / values.length;
      let squares = 0;
      for (const v of values) squares += (v - mean) * (v - mean);
      const sigma = Math.sqrt(squares / (values.length - 1));
      return { mean, sigma, min, max, below, above };
    }

    function formatResult(nominal, tol, specMin, specMax) {
      const min = nominal - tol;
      const max = nominal + tol;
      let html = `
        ${t("nominal")}: <b>${nominal.toFixed(4)}</b><br>
        ${t("tolerance")}: <b>± ${tol.toFixed(4)}</b><br>
        ${t("min")}: <b>${min.toFixed(4)}</b><br>
        ${t("max")}: <b>${max.toFixed(4)}</b><br>`;
      if (specMin === null && specMax === null) return html;
      const pass = (specMin === null || min >= specMin) && (specMax === null || max <= specMax);
      return html + `<span class="status ${pass ? "pass" : "fail"}">${pass ? "PASS" : "FAIL"}</span>`;
    }

    // notNormal: radial offsets and fit margins are not bell curves, so the σ-level
    // lines are left out for them.
    function formatMonteCarlo(s, runs, specMin, specMax, sigmaLevel, notNormal) {
      const pct = n => (100 * n / runs).toFixed(2) + "%";
      let html = `
        ${t("mean")}: <b>${s.mean.toFixed(4)}</b><br>
        ${t("stdDev")}: <b>${s.sigma.toFixed(4)}</b><br>
        ±${sigmaLevel}σ: <b>± ${(sigmaLevel * s.sigma).toFixed(4)}</b><br>
        ${t("smallest")}: <b>${s.min.toFixed(4)}</b><br>
        ${t("largest")}: <b>${s.max.toFixed(4)}</b><br>`;
      if (specMin === null && specMax === null) return html;

      if (specMin !== null) html += `${t("belowMin")}: <b>${pct(s.below)}</b> (${s.below.toLocaleString()})<br>`;
      if (specMax !== null) html += `${t("aboveMax")}: <b>${pct(s.above)}</b> (${s.above.toLocaleString()})<br>`;
      const out = s.below + s.above;
      html += `${t("outside")}: <b>${pct(out)}</b>
               (${t("outOf", out.toLocaleString(), runs.toLocaleString())})<br>`;

      // σ-level lines (extra information). Skipped for radial offset, which is
      // not a bell curve, and when σ is 0.
      if (!notNormal && s.sigma > 0) {
        let z = Infinity;
        if (specMin !== null) z = Math.min(z, (s.mean - specMin) / s.sigma);
        if (specMax !== null) z = Math.min(z, (specMax - s.mean) / s.sigma);
        const both = specMin !== null && specMax !== null;
        const mark = z >= sigmaLevel ? "✔" : "✘";
        html += `${t("specSigma", (both ? "±" : "") + z.toFixed(2), sigmaLevel)} <b>${mark}</b><br>`;
        const needLo = (s.mean - sigmaLevel * s.sigma).toFixed(4);
        const needHi = (s.mean + sigmaLevel * s.sigma).toFixed(4);
        const range = both ? `${needLo} – ${needHi}` : specMin !== null ? `≤ ${needLo}` : `≥ ${needHi}`;
        html += `${t("needed", sigmaLevel, range)}<br>`;
      }

      // PASS/FAIL uses the ppm rule, as in stackup.html.
      const allowed = sigmaLevel === 6 ? 0.0000034 : 0.0027;
      const ppm = (out / runs * 1e6).toLocaleString(undefined, { maximumFractionDigits: 1 });
      html += `${t("allowed")}: <b>${sigmaLevel === 6 ? "≤ 3.4 ppm" : "≤ 0.27%"}</b>
               (${t("ppmNow", ppm)})<br>`;
      const pass = out / runs <= allowed;
      return html + `<span class="status ${pass ? "pass" : "fail"}">${pass ? "PASS" : "FAIL"}</span>`;
    }

    function measureLabel(measure) {
      return measure === "dx" ? "ΔX" : measure === "dy" ? "ΔY" : measure === "fit" ? t("fitMeasure") : t("radial");
    }

    function renderResults() {
      const r = lastResults;
      document.getElementById("results").innerHTML = r.checks.map((c, i) => {
        const radial = c.measure === "radial", fit = c.measure === "fit";
        const statBox = tol => radial ? `<p class="note">${t("mcOnly")}</p>`
                             : fit ? `<p class="note">${t("mcOnlyFit")}</p>`
                             : formatResult(c.nominal, tol, c.min, c.max);
        return `
          <div class="result-card">
            <h3>${esc(c.name)}<span class="tag">${measureLabel(c.measure)}</span></h3>
            <p class="note">${t("nominalLine", c.nominal.toFixed(4))}${fit ? "<br>" + t("fitNote") : ""}</p>
            <div class="results">
              <div class="result-box"><h4>${t("worstCase")}</h4>${statBox(c.wc)}</div>
              <div class="result-box"><h4>${t("rss")}</h4>${statBox(c.rss)}</div>
              <div class="result-box"><h4>${t("monteCarlo")}</h4>
                ${formatMonteCarlo(c.stats, r.runs, c.min, c.max, r.k, radial || fit)}</div>
            </div>
            <div class="chart-row">
              <div class="chart-area">
                <canvas id="hist${i}"></canvas>
                <div class="tooltip"></div>
              </div>
              ${radial ? `<div class="scatter-area">
                            <canvas id="scat${i}"></canvas>
                            <p class="note">${t("scatterNote")}</p>
                          </div>` : ""}
            </div>
            ${contributionHtml(c)}
          </div>`;
      }).join("");
      document.getElementById("legend").style.display = "block";

      r.checks.forEach((c, i) => attachTooltip(document.getElementById("hist" + i)));
      drawAllCharts();
    }

    function drawAllCharts() {
      lastResults.checks.forEach((c, i) => {
        drawHistogram(document.getElementById("hist" + i), c.values, c.stats, c.min, c.max, c.nominal);
        if (c.xy) drawScatter(document.getElementById("scat" + i), c.xy.x, c.xy.y, c.max);
      });
    }

    // A readable name for a contributor key such as "f12:pos" or "i3:float1".
    function contributorLabel(key) {
      const [id, part] = key.split(":");
      const word = TEXT[lang]["part_" + part] || part;
      const feat = findFeature(id);
      if (feat) return `${feat.item.name} / ${feat.f.name} ${word}`;
      const item = itemById(id);
      return `${item ? item.name : "?"} · ${word}`;
    }

    // Bars showing each contributor's share of the RSS variation (top 8 + "Other").
    function contributionHtml(c) {
      if (c.measure === "fit" || !c.contrib.length) return "";
      const v = x => c.measure === "dx" ? x.vx : c.measure === "dy" ? x.vy : x.vx + x.vy;
      const total = c.contrib.reduce((s, x) => s + v(x), 0);
      if (!(total > 0)) return "";
      const sorted = c.contrib.map(x => ({ key: x.key, share: v(x) / total }))
                              .sort((a, b) => b.share - a.share);
      const top = sorted.slice(0, 8);
      const rest = sorted.slice(8).reduce((s, x) => s + x.share, 0);
      if (rest > 0) top.push({ key: null, share: rest });
      return `
        <div class="contrib">
          <h4>${t("contribTitle")}</h4>
          ${top.map(x => `
            <div class="contrib-row">
              <span>${esc(x.key ? contributorLabel(x.key) : t("other"))}</span>
              <span class="contrib-bar"><span style="width:${(x.share * 100).toFixed(1)}%"></span></span>
              <span class="contrib-pct">${(x.share * 100).toFixed(1)}%</span>
            </div>`).join("")}
          <p class="note">${t("contribNote")}</p>
        </div>`;
    }

    // Scatter plot: where the "To" feature lands relative to the "From" feature (ΔX, ΔY).
    function drawScatter(canvas, xs, ys, radius) {
      const ctx = canvas.getContext("2d");
      const size = Math.min(canvas.parentElement.clientWidth, 300);
      const scale = window.devicePixelRatio || 1;
      canvas.width = size * scale;
      canvas.height = size * scale;
      canvas.style.width = size + "px";
      canvas.style.height = size + "px";
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, size, size);

      // Range: the farthest point or the tolerance circle, whichever is bigger, + 10%.
      let ext = radius || 0;
      for (let i = 0; i < xs.length; i++) ext = Math.max(ext, Math.abs(xs[i]), Math.abs(ys[i]));
      ext = (ext || 1) * 1.1;
      const pad = 24, half = (size - 2 * pad) / 2, mid = size / 2;
      const px = v => mid + v / ext * half;
      const py = v => mid - v / ext * half;   // canvas y grows downward, so flip it

      // Cross-hair axes, labelled at their ends.
      ctx.strokeStyle = "#e5e5e5";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad, mid); ctx.lineTo(size - pad, mid);
      ctx.moveTo(mid, pad); ctx.lineTo(mid, size - pad);
      ctx.stroke();
      ctx.fillStyle = "#666";
      ctx.font = "11px Arial";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText("ΔX → " + ext.toFixed(3), size - 2, size - 2);   // corner, clear of the circle
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("ΔY ↑ " + ext.toFixed(3), mid + 4, 4);

      // Dots: at most about 4000 so the chart stays fast. Red outside the circle.
      const step = Math.max(1, Math.floor(xs.length / 4000));
      for (let i = 0; i < xs.length; i += step) {
        const outside = radius !== null && Math.hypot(xs[i], ys[i]) > radius;
        ctx.fillStyle = outside ? "rgba(192, 57, 43, 0.8)" : "rgba(31, 111, 235, 0.35)";
        ctx.fillRect(px(xs[i]) - 1, py(ys[i]) - 1, 2, 2);
      }

      // The tolerance circle = Max (USL).
      if (radius !== null) {
        ctx.strokeStyle = RED;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.arc(mid, mid, radius / ext * half, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // =====================================================================
    // HISTOGRAM (from stackup.html, now drawing on any canvas)
    // =====================================================================

    const BLUE = "#1f6feb";
    const RED = "#c0392b";
    const BINS = 50;

    function drawHistogram(canvas, values, stats, specMin, specMax, nominal) {
      const ctx = canvas.getContext("2d");
      const width = canvas.parentElement.clientWidth;
      const height = 260;
      const scale = window.devicePixelRatio || 1;
      canvas.width = width * scale;
      canvas.height = height * scale;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, width, height);

      // 1. x-axis range: data, nominal and spec lines, with 5% padding.
      let lo = Math.min(stats.min, nominal);
      let hi = Math.max(stats.max, nominal);
      if (specMin !== null) lo = Math.min(lo, specMin);
      if (specMax !== null) hi = Math.max(hi, specMax);
      if (hi === lo) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * 0.05;
      lo -= pad;
      hi += pad;

      // 2. Count values per bin.
      const binWidth = (hi - lo) / BINS;
      const counts = new Array(BINS).fill(0);
      for (const v of values) counts[Math.min(BINS - 1, Math.floor((v - lo) / binWidth))]++;
      let maxCount = 0;
      for (const c of counts) if (c > maxCount) maxCount = c;

      // 3. Plot area and value → pixel helpers.
      const left = 56, right = 16, top = 28, bottom = 36;
      const plotW = width - left - right;
      const plotH = height - top - bottom;
      const baseY = top + plotH;
      const xPx = value => left + (value - lo) / (hi - lo) * plotW;
      const yPx = count => baseY - count / maxCount * plotH;

      // 4. Grid lines and count labels.
      ctx.font = "12px Arial";
      ctx.lineWidth = 1;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let k = 0; k <= 4; k++) {
        const c = maxCount * k / 4;
        const y = yPx(c);
        ctx.strokeStyle = "#e5e5e5";
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + plotW, y);
        ctx.stroke();
        ctx.fillStyle = "#666";
        ctx.fillText(Math.round(c).toLocaleString(), left - 6, y);
      }

      // 5. Bars: red outside the limits, blue inside.
      const barPx = plotW / BINS;
      for (let i = 0; i < BINS; i++) {
        if (counts[i] === 0) continue;
        const center = lo + (i + 0.5) * binWidth;
        const outside = (specMin !== null && center < specMin) || (specMax !== null && center > specMax);
        ctx.fillStyle = outside ? RED : BLUE;
        const x = left + i * barPx + 1;
        const w = Math.max(1, barPx - 2);
        const y = yPx(counts[i]);
        const r = Math.min(4, w / 2, baseY - y);
        ctx.beginPath();
        ctx.roundRect(x, y, w, baseY - y, [r, r, 0, 0]);
        ctx.fill();
      }

      // 6. x-axis line and labels.
      ctx.strokeStyle = "#999";
      ctx.beginPath();
      ctx.moveTo(left, baseY);
      ctx.lineTo(left + plotW, baseY);
      ctx.stroke();
      ctx.fillStyle = "#666";
      ctx.textBaseline = "top";
      for (let k = 0; k <= 4; k++) {
        const value = lo + (hi - lo) * k / 4;
        ctx.textAlign = k === 0 ? "left" : k === 4 ? "right" : "center";
        ctx.fillText(value.toFixed(3), xPx(value), baseY + 8);
      }

      // 7. Nominal and spec lines.
      drawLine(ctx, xPx(nominal), top, baseY, "#888", false, "");
      if (specMin !== null) drawLine(ctx, xPx(specMin), top, baseY, RED, true, "LSL " + specMin);
      if (specMax !== null) drawLine(ctx, xPx(specMax), top, baseY, RED, true, "USL " + specMax);

      // Remember the bars on the canvas itself, for its tooltip.
      canvas.hover = { lo, binWidth, counts, left, barPx, top, runs: values.length };
    }

    function drawLine(ctx, x, top, bottom, color, dashed, label) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash(dashed ? [6, 4] : []);
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      if (label) {
        ctx.fillStyle = "#222";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(label, x, top - 6);
      }
    }

    // Tooltip for one chart: show the bar under the mouse.
    function attachTooltip(canvas) {
      const tooltip = canvas.nextElementSibling;
      canvas.addEventListener("mousemove", event => {
        const h = canvas.hover;
        if (!h) return;
        const mouseX = event.offsetX;
        const i = Math.floor((mouseX - h.left) / h.barPx);
        if (i < 0 || i >= BINS) { tooltip.style.display = "none"; return; }
        const from = h.lo + i * h.binWidth;
        const pct = (100 * h.counts[i] / h.runs).toFixed(2);
        tooltip.innerHTML = `${t("tipRange", from.toFixed(4), (from + h.binWidth).toFixed(4))}<br>
                             ${t("tipCount", h.counts[i].toLocaleString(), pct)}`;
        tooltip.style.display = "block";
        const flip = mouseX > canvas.clientWidth - 180;
        tooltip.style.left = (flip ? mouseX - tooltip.offsetWidth - 12 : mouseX + 12) + "px";
        tooltip.style.top = (h.top + 4) + "px";
      });
      canvas.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
    }

    window.addEventListener("resize", () => { if (lastResults) drawAllCharts(); });

    // =====================================================================
    // TEMPLATES (ready-made examples to start from)
    // =====================================================================

    // Finds a feature id by item + feature name (only used while building templates).
    function fid(item, name) { return item.features.find(f => f.name === name).id; }

    function pinLink(child, parent, p1, h1, p2, h2, mode) {
      Object.assign(child.locate, { method: "twoPin", mode,
        p1: fid(parent, p1), h1: fid(child, h1), p2: fid(parent, p2), h2: fid(child, h2) });
    }

    function newCheck(name, itemP, featP, itemQ, featQ, measure, min, max) {
      return { id: uid("c"), name, p: fid(itemP, featP), q: fid(itemQ, featQ), measure, min, max };
    }

    // The templates use ±X / ±Y tolerances only, so they fit the simple view.

    // Parts A and B, each with two locating holes and one mating point at (40, 30).
    function makePart(name, parentId, holes, pointName) {
      const part = newItem(name, "part", parentId);
      part.features = holes.map(([n, x, y]) => newFeature(n, "hole", x, y, 3.05, 0, 0.025, 0.025, 0));
      part.features.push(newFeature(pointName, "point", 40, 30, 0, 0, 0.05, 0.05, 0));
      return part;
    }

    function carrierPin(name, x, y, d) {
      return newFeature(name, "pin", x, y, d, 0, 0.01, 0.01, 0);
    }

    function abChecks(a, b) {
      return [
        newCheck("A–B ΔX", a, "PtA", b, "PtB", "dx", -0.2, 0.2),
        newCheck("A–B ΔY", a, "PtA", b, "PtB", "dy", -0.2, 0.2),
        newCheck("A–B " + t("radial"), a, "PtA", b, "PtB", "radial", null, 0.25)
      ];
    }

    // Condition 1: part A and part B are both located on the same carrier.
    function templateCondition1() {
      nextId = 1;
      const carrier = newItem(t("tplCarrier"), "fixture", null);
      carrier.features = [carrierPin("PA1", 0, 0, 3), carrierPin("PA2", 80, 0, 3),
                          carrierPin("PB1", 0, 60, 3), carrierPin("PB2", 80, 60, 3)];
      const a = makePart(t("tplPartA"), carrier.id, [["HA1", 0, 0], ["HA2", 80, 0]], "PtA");
      const b = makePart(t("tplPartB"), carrier.id, [["HB1", 0, 60], ["HB2", 80, 60]], "PtB");
      pinLink(a, carrier, "PA1", "HA1", "PA2", "HA2", "free");
      pinLink(b, carrier, "PB1", "HB1", "PB2", "HB2", "free");
      return { description: t("tplCond1Desc"), items: [carrier, a, b], checks: abChecks(a, b) };
    }

    // Condition 2: A on the carrier; an align block on the carrier; B on the align block.
    function templateCondition2() {
      nextId = 1;
      const carrier = newItem(t("tplCarrier"), "fixture", null);
      carrier.features = [carrierPin("PA1", 0, 0, 3), carrierPin("PA2", 80, 0, 3),
                          carrierPin("PK1", -20, 90, 4), carrierPin("PK2", 100, 90, 4)];
      const block = newItem(t("tplBlock"), "fixture", carrier.id);
      block.features = [
        newFeature("K1", "hole", -20, 90, 4.03, 0, 0.015, 0.015, 0),
        newFeature("K2", "hole", 100, 90, 4.03, 0, 0.015, 0.015, 0),
        carrierPin("PB1", 0, 60, 3), carrierPin("PB2", 80, 60, 3)
      ];
      pinLink(block, carrier, "PK1", "K1", "PK2", "K2", "free");
      const a = makePart(t("tplPartA"), carrier.id, [["HA1", 0, 0], ["HA2", 80, 0]], "PtA");
      const b = makePart(t("tplPartB"), block.id, [["HB1", 0, 60], ["HB2", 80, 60]], "PtB");
      pinLink(a, carrier, "PA1", "HA1", "PA2", "HA2", "free");
      pinLink(b, block, "PB1", "HB1", "PB2", "HB2", "free");
      return { description: t("tplCond2Desc"), items: [carrier, a, block, b], checks: abChecks(a, b) };
    }

    // Condition 3: A on the carrier by two pins; B is a rectangle with a row of holes on
    // each side, tightened by matching carrier pins (pin pattern, best fit).
    function templateCondition3() {
      nextId = 1;
      const carrier = newItem(t("tplCarrier"), "fixture", null);
      carrier.features = [carrierPin("PA1", 0, 0, 3), carrierPin("PA2", 80, 0, 3)];
      const a = makePart(t("tplPartA"), carrier.id, [["HA1", 0, 0], ["HA2", 80, 0]], "PtA");
      pinLink(a, carrier, "PA1", "HA1", "PA2", "HA2", "free");

      const b = newItem(t("tplPartB"), "part", carrier.id);
      const rect = { shape: "rect", x: 40, y: 30, w: 120, h: 100, nx: 4, px: 25, ny: 3, py: 25 };
      for (const p of patternPoints(rect)) {
        b.features.push(newFeature("H-" + p.suffix, "hole", p.x, p.y, 3.02, 0, 0.02, 0.02, 0));
        carrier.features.push(carrierPin("P-" + p.suffix, p.x, p.y, 3));
      }
      b.features.push(newFeature("PtB", "point", 40, 30, 0, 0, 0.05, 0.05, 0));
      Object.assign(b.locate, { method: "pattern", mode: "tight" });
      return { description: t("tplCond3Desc"), items: [carrier, a, b], checks: abChecks(a, b) };
    }

    // Condition 4: A pushed against edge stops; B in a pocket; B's pin must enter A's hole.
    function templateCondition4() {
      nextId = 1;
      const stopPin = (n, x, y) => newFeature(n, "pin", x, y, 6, 0, 0.01, 0.01, 0);
      const carrier = newItem(t("tplCarrier"), "fixture", null);
      carrier.features = [stopPin("S1", 10, -3), stopPin("S2", 90, -3), stopPin("S3", -3, 25),
                          newFeature("Pocket", "point", 40, 30, 0, 0, 0.02, 0.02, 0)];

      const a = newItem(t("tplPartA"), "part", carrier.id);
      a.features = [
        newFeature("E1", "point", 10, 0, 0, 0, 0, 0.03, 0),     // bottom edge: profile → ±Y
        newFeature("E2", "point", 90, 0, 0, 0, 0, 0.03, 0),
        newFeature("E3", "point", 0, 25, 0, 0, 0.03, 0, 0),     // left edge: profile → ±X
        newFeature("HoleA", "hole", 40, 30, 4.2, 0, 0.03, 0.03, 0)
      ];
      Object.assign(a.locate, { method: "stops", n1: "-y", n2: "-x",
        s1p: fid(carrier, "S1"), s1h: fid(a, "E1"), s2p: fid(carrier, "S2"), s2h: fid(a, "E2"),
        s3p: fid(carrier, "S3"), s3h: fid(a, "E3") });

      const b = newItem(t("tplPartB"), "part", carrier.id);
      b.features = [newFeature("CenterB", "point", 40, 30, 0, 0, 0, 0, 0),
                    newFeature("PinB", "pin", 40, 30, 4.0, 0, 0.02, 0.02, 0)];
      Object.assign(b.locate, { method: "pocket", pc: fid(carrier, "Pocket"), hc: fid(b, "CenterB"),
                                pw: 60, ph: 40, cx: 0.1, cy: 0.1, cxTol: 0, cyTol: 0 });

      const checks = [
        { id: uid("c"), name: "B → A", p: b.id, q: a.id, measure: "fit", min: 0, max: null },
        newCheck("HoleA–PinB", a, "HoleA", b, "PinB", "radial", null, 0.1)
      ];
      return { description: t("tplCond4Desc"), items: [carrier, a, b], checks };
    }

    // Component example: A on fixture AA; B fixed to A; C fixed to B (known tolerances);
    // fixture AB on AA; D on AB. D's two pins must go into holes on B and C.
    function templateComponent() {
      nextId = 1;
      const pin = (n, x, y, d) => newFeature(n, "pin", x, y, d, 0, 0.01, 0.01, 0);
      const hole = (n, x, y, d, tol) => newFeature(n, "hole", x, y, d, 0, tol, tol, 0);
      const point = (n, x, y, tol) => newFeature(n, "point", x, y, 0, 0, tol, tol, 0);

      const AA = newItem("AA", "fixture", null);
      AA.features = [pin("PA1", 0, 0, 3), pin("PA2", 120, 0, 3), pin("PK1", -20, 100, 4), pin("PK2", 140, 100, 4)];

      const A = newItem("A", "part", AA.id);
      A.features = [hole("HA1", 0, 0, 3.05, 0.025), hole("HA2", 120, 0, 3.05, 0.025), point("PtA", 60, 40, 0.05)];
      pinLink(A, AA, "PA1", "HA1", "PA2", "HA2", "free");

      const B = newItem("B", "part", A.id);
      B.features = [point("RefB", 30, 40, 0), hole("HB", 30, 60, 3.1, 0.02)];
      Object.assign(B.locate, { method: "known", pivot: fid(B, "RefB"), tx: 0.03, ty: 0.03, tt: 0.02 });

      const C = newItem("C", "part", B.id);
      C.features = [point("RefC", 90, 40, 0), hole("HC", 90, 60, 3.1, 0.02)];
      Object.assign(C.locate, { method: "known", pivot: fid(C, "RefC"), tx: 0.02, ty: 0.02, tt: 0.02 });

      const AB = newItem("AB", "fixture", AA.id);
      AB.features = [hole("K1", -20, 100, 4.03, 0.015), hole("K2", 140, 100, 4.03, 0.015),
                     pin("PD1", 0, 120, 3), pin("PD2", 120, 120, 3)];
      pinLink(AB, AA, "PK1", "K1", "PK2", "K2", "free");

      const D = newItem("D", "part", AB.id);
      D.features = [hole("HD1", 0, 120, 3.05, 0.025), hole("HD2", 120, 120, 3.05, 0.025),
                    point("PtD", 60, 40, 0.05),
                    newFeature("PinB", "pin", 30, 60, 2.9, 0, 0.02, 0.02, 0),
                    newFeature("PinC", "pin", 90, 60, 2.9, 0, 0.02, 0.02, 0)];
      pinLink(D, AB, "PD1", "HD1", "PD2", "HD2", "free");

      const checks = [
        newCheck("A–D", A, "PtA", D, "PtD", "radial", null, 0.2),
        newCheck("B–D", B, "HB", D, "PinB", "radial", null, 0.1),
        newCheck("C–D", C, "HC", D, "PinC", "radial", null, 0.1),
        { id: uid("c"), name: "D → A+B+C", p: D.id, q: "*", measure: "fit", min: 0, max: null }
      ];
      return { description: t("tplCompDesc"), items: [AA, A, B, C, AB, D], checks };
    }

    const TEMPLATES = {
      1: [templateCondition1, "tplCond1"], 2: [templateCondition2, "tplCond2"],
      3: [templateCondition3, "tplCond3"], 4: [templateCondition4, "tplCond4"],
      5: [templateComponent, "tplComp"]
    };

    function loadTemplate(n) {
      if (isDirty() && !confirm(t("confirmReplace"))) return;
      const [make, nameKey] = TEMPLATES[n];
      model = make();
      model.name = t(nameKey);
      afterReplace();
    }

    // Start: bring back the last work from this browser, or else Condition 1.
    let restored = false;
    if (canStore) {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (saved) {
          applyProject(saved);
          cleanSnapshot = saved.clean ? JSON.stringify(model) : null;
          restored = true;
        }
      } catch (e) {}   // a damaged browser copy: just start fresh
    }
    if (!restored) {
      model = templateCondition1();
      model.name = t("tplCond1");
      cleanSnapshot = JSON.stringify(model);
    }
    applyLanguage();
    if (restored) setMessages([{ type: "info", key: "restored", args: [] }]);

    // Phone app: keep a copy for offline use (only possible on an https:// address).
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
