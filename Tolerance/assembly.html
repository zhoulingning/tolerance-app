<!DOCTYPE html>
<!--
  ASSEMBLY.HTML - 2D fixture & assembly tolerance calculator (Phase 1).

  The assembly is a TREE of items (fixtures, carriers, blocks, parts).
  Each item sits on a parent item and is located by:
    - two pins (round + diamond), with free float or tight fit, or
    - a known relative tolerance (±dX, ±dY, ±θ), for parts already fixed together.
  Checks compare any two features (points) and measure ΔX, ΔY or radial offset.

  Like stackup.html, the page has three parts: HTML, CSS and JavaScript.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assembly Tolerance</title>
  <!-- Phone app settings (see index.html, manifest.webmanifest and sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f6feb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tolerance">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <!-- ========== PART 2: CSS (how things look) ========== -->
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    .card {
      position: relative;   /* lets the language button sit in the top-right corner */
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    h1 { margin-top: 0; font-size: 1.5em; padding-right: 100px; }
    h2 { font-size: 1.2em; margin: 24px 0 8px; }
    h3 { font-size: 1em; margin: 12px 0 6px; }
    h4 { font-size: 1em; margin: 0 0 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px; text-align: left; }
    th { border-bottom: 2px solid #ccc; font-size: 0.85em; white-space: nowrap; }
    input, select {
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
      font-size: 0.95em;
    }
    td input, td select { min-width: 64px; }
    label { font-size: 0.9em; }
    button {
      margin-top: 12px;
      padding: 10px 20px;
      font-size: 1em;
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1558c0; }
    /* Smaller, outlined buttons for add / remove / templates */
    button.small {
      margin: 6px 6px 0 0;
      padding: 5px 12px;
      font-size: 0.85em;
      background: white;
      color: #1f6feb;
      border: 1px solid #1f6feb;
    }
    button.small:hover { background: #eef4ff; }
    button.danger { color: #c0392b; border-color: #c0392b; }
    button.danger:hover { background: #fdeeee; }
    .lang-button {
      position: absolute;
      top: 16px;
      right: 16px;
      margin: 0;
      padding: 6px 14px;
      font-size: 0.9em;
      background: white;
      color: #1f6feb;
      border: 1px solid #1f6feb;
    }
    .lang-button:hover { background: #eef4ff; }
    .note { font-size: 0.85em; color: #666; }
    .spec {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row label { flex: 1; min-width: 150px; }
    .table-wrap { overflow-x: auto; }  /* wide tables scroll sideways on small screens */

    /* One card per item. The colored left border shows fixture or part. */
    .item-card {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-left: 5px solid #888;
      border-radius: 6px;
      background: #fcfcfd;
    }
    .item-card.part { border-left-color: #1f6feb; }
    .locate {
      margin-top: 10px;
      padding: 10px;
      background: #f2f6fc;
      border-radius: 6px;
    }
    .pair-label { min-width: 150px; font-size: 0.85em; }
    .locate td select { min-width: 100px; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-family: inherit;
      font-size: 0.95em;
    }
    /* The "Assembly structure" overview */
    .structure {
      margin: 0;
      padding: 10px;
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.85em;
      overflow-x: auto;
    }
    .hidden-mark { color: #a35a00; cursor: help; }
    /* The "+ Add pattern" form */
    .pattern-form {
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed #1f6feb;
      border-radius: 6px;
      background: #f7faff;
    }
    .pattern-form .row { margin-top: 6px; }
    .checkbox { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .checkbox input { width: auto; }
    /* Histogram + scatter side by side (wrapping on small screens) */
    .chart-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .chart-row .chart-area { flex: 2 1 300px; min-width: 0; }
    .scatter-area { flex: 1 1 220px; max-width: 300px; margin-top: 10px; }
    /* Contribution bars */
    .contrib { margin-top: 12px; }
    .contrib-row {
      display: grid;
      grid-template-columns: minmax(120px, 40%) 1fr 52px;
      gap: 8px;
      align-items: center;
      font-size: 0.85em;
      margin: 4px 0;
    }
    .contrib-bar { background: #eef1f5; border-radius: 4px; height: 10px; overflow: hidden; }
    .contrib-bar span { display: block; height: 100%; background: #1f6feb; border-radius: 0 4px 4px 0; }
    .contrib-pct { text-align: right; }

    /* Link back to the app's start page (an installed app has no browser back button) */
    .home-link { display: inline-block; margin-bottom: 8px; color: #1f6feb; text-decoration: none; font-size: 0.9em; }

    /* Phones: tighter spacing, bigger touch targets, and 16px text in inputs
       (smaller text makes iPhones zoom in whenever you tap a box). */
    @media (max-width: 480px) {
      body { padding: 8px; }
      .card { padding: 14px; }
      h1 { font-size: 1.25em; }
      .lang-button { top: 12px; right: 12px; }
      input, select, textarea { font-size: 16px; }
      td input, td select { min-width: 76px; }
      button.small { padding: 8px 12px; }
      .result-box { min-width: 100%; }
    }

    /* Messages */
    .error { color: #c0392b; margin-top: 6px; }
    .warning { color: #a35a00; margin-top: 6px; }
    .info { color: #555; margin-top: 6px; }

    /* Results */
    .result-card {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .results { display: flex; gap: 12px; flex-wrap: wrap; }
    .result-box {
      flex: 1;
      min-width: 200px;
      border: 1px solid #e3e3e3;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.92em;
    }
    .tag {
      font-size: 0.8em;
      font-weight: normal;
      background: #eef1f5;
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 6px;
    }
    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 4px;
      color: white;
      font-weight: bold;
    }
    .pass { background: #2e9e44; }
    .fail { background: #c0392b; }

    /* Histogram */
    .chart-area { position: relative; margin-top: 10px; }
    canvas { display: block; }
    .legend { font-size: 0.85em; color: #444; margin-top: 6px; display: none; }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      vertical-align: middle;
      margin: 0 4px 0 12px;
    }
    .tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: #222;
      color: white;
      font-size: 0.8em;
      padding: 6px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- ========== PART 1: HTML (what is on the page) ========== -->
  <!-- Most of the page is drawn by JavaScript from the "model" (see render()). -->
  <div class="card">
    <button id="langButton" class="lang-button" onclick="toggleLanguage()">中文</button>
    <a class="home-link" href="index.html" data-i18n="home">← Home</a>

    <h1 data-i18n="title">Assembly Tolerance Calculator</h1>
    <p class="note" data-i18n="intro"></p>
    <p class="note"><b data-i18n="coordNote"></b></p>

    <!-- Project: name, save / open a file, start new. Work is also kept in this browser. -->
    <div class="spec">
      <h4 data-i18n="projectTitle">Project</h4>
      <div class="row">
        <label><span data-i18n="projectName"></span>
          <input id="projectName" onchange="model.name = this.value; saveToBrowser()">
        </label>
      </div>
      <button class="small" onclick="saveProjectFile()" data-i18n="saveFile"></button>
      <button class="small" onclick="document.getElementById('fileInput').click()" data-i18n="openFile"></button>
      <button class="small" onclick="newProject()" data-i18n="newProject"></button>
      <!-- No "accept" filter: some iPhones grey out .json files when one is set. -->
      <input id="fileInput" type="file" hidden onchange="openProjectFile(this)">
      <p id="storeNote" class="note"></p>
    </div>

    <!-- Templates: ready-made examples to start from -->
    <div class="spec">
      <h4 data-i18n="templatesTitle">Templates</h4>
      <button class="small" onclick="loadTemplate(1)" data-i18n="tplCond1"></button>
      <button class="small" onclick="loadTemplate(2)" data-i18n="tplCond2"></button>
      <button class="small" onclick="loadTemplate(3)" data-i18n="tplCond3"></button>
      <button class="small" onclick="loadTemplate(4)" data-i18n="tplCond4"></button>
      <button class="small" onclick="loadTemplate(5)" data-i18n="tplComp"></button>
    </div>

    <!-- What this setup is: filled in by the templates, and editable by you -->
    <h2 data-i18n="descTitle">Setup description</h2>
    <textarea id="description" rows="3" oninput="fitHeight(this)"
              onchange="model.description = this.value; saveToBrowser()"></textarea>

    <!-- A live overview of the tree, drawn from the items below -->
    <h2 data-i18n="structureTitle">Assembly structure</h2>
    <pre id="structure" class="structure"></pre>

    <!-- The assembly tree: one card per item -->
    <h2 data-i18n="itemsTitle">Assembly items</h2>
    <button id="viewButton" class="small" onclick="toggleView()"></button>
    <div id="items"></div>
    <button class="small" onclick="addItem()" data-i18n="addItem"></button>

    <!-- What to check between features -->
    <h2 data-i18n="checksTitle">Checks</h2>
    <div id="checks"></div>
    <button class="small" onclick="addCheck()" data-i18n="addCheck"></button>

    <!-- Monte Carlo settings, same as stackup.html -->
    <div class="spec">
      <h4 data-i18n="settingsTitle">Monte Carlo Settings</h4>
      <div class="row">
        <label><span data-i18n="runs"></span>
          <input id="runs" type="number" value="10000" min="100" max="1000000" step="1000"
                 onchange="saveToBrowser()">
        </label>
        <label><span data-i18n="sigmaStd"></span>
          <select id="sigmaLevel" onchange="saveToBrowser()">
            <option value="3" data-i18n="opt3"></option>
            <option value="6" data-i18n="opt6"></option>
          </select>
        </label>
      </div>
      <p class="note" data-i18n="mcNote"></p>
    </div>

    <button onclick="calculate()" data-i18n="calculate">Calculate</button>

    <!-- Errors, warnings and "calculating..." appear here -->
    <div id="messages"></div>

    <!-- Results: one card per check -->
    <div id="results"></div>
    <div id="legend" class="legend">
      <span class="swatch" style="background:#1f6feb"></span><span data-i18n="legendIn"></span>
      <span class="swatch" style="background:#c0392b"></span><span data-i18n="legendOut"></span>
      <span class="swatch" style="background:none; border-left:2px dashed #c0392b; border-radius:0"></span><span data-i18n="legendSpec"></span>
      <span class="swatch" style="background:none; border-left:2px solid #888; border-radius:0"></span><span data-i18n="legendNom"></span>
    </div>
  </div>

    let lang = "en";
    try {
      if (localStorage.getItem("stackupLang") === "zh") lang = "zh";  // shared with stackup.html
    } catch (e) {}

    // t = "translate": looks up a key in the current language.
    function t(key, ...args) {
      const entry = TEXT[lang][key];
      return typeof entry === "function" ? entry(...args) : entry;
    }

    function toggleLanguage() {
      lang = lang === "en" ? "zh" : "en";
      try { localStorage.setItem("stackupLang", lang); } catch (e) {}
      applyLanguage();
    }

    function applyLanguage() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = t("pageTitle");
      document.getElementById("langButton").textContent = t("switchTo");
      for (const el of document.querySelectorAll("[data-i18n]")) {
        el.textContent = t(el.dataset.i18n);
      }
      document.getElementById("description").placeholder = t("descHint");
      document.getElementById("storeNote").textContent = t(canStore ? "autoSaveOn" : "autoSaveOff");
      render();          // the editors are built from text too
      showMessages();
      if (lastResults) renderResults();
    }

    // Makes text safe to put inside HTML (so a name like "<A>" can't break the page).
    function esc(text) {
      return String(text).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    // =====================================================================
    // THE MODEL: all the data the user enters
    // =====================================================================
    //
    // model = {
    //   items:  [ { id, name, type, parent, locate, features: [...] } ],
    //   checks: [ { id, name, p, q, measure, min, max } ]
    // }
    // A feature: { id, name, kind, x, y, d, dTol, tolX, tolY, tp }
    //   x, y   - nominal position in the assembly coordinate system
    //   d, dTol - diameter Ø and its ± tolerance (holes and pins)
    //   tolX, tolY - ± coordinate tolerances
    //   tp     - ⌀ position tolerance

    let model = null;
    let nextId = 1;
    let lastResults = null;   // the latest results, so they can be re-shown in another language
    let messages = [];        // the latest errors / warnings
    let patternForm = null;   // the "+ Add pattern" form that is open (null = none)

    // Saving: cleanSnapshot is the model (as text) at the last template / open / save,
    // so we can tell whether there are unsaved changes. null = "assume unsaved".
    let cleanSnapshot = null;
    const STORE_KEY = "assemblyProject";
    let canStore = false;     // can this browser keep data for us?
    try {
      localStorage.setItem("assemblyTest", "1");
      localStorage.removeItem("assemblyTest");
      canStore = true;
    } catch (e) {}

    // Simple view (false) hides the ±Ø and ⌀ Position columns. Remembered per browser.
    let fullView = false;
    try { fullView = localStorage.getItem("assemblyFullView") === "1"; } catch (e) {}

    function uid(prefix) { return prefix + (nextId++); }

    function newFeature(name, kind, x, y, d, dTol, tolX, tolY, tp) {
      return { id: uid("f"), name, kind, x, y, d, dTol, tolX, tolY, tp };
    }

    function newItem(name, type, parent) {
      return {
        id: uid("i"), name, type, parent,
        locate: { method: "twoPin", mode: "free", p1: "", h1: "", p2: "", h2: "",   // two pins
                  pivot: "", tx: 0, ty: 0, tt: 0,                                  // known tolerance
                  n1: "-y", n2: "-x", s1p: "", s1h: "", s2p: "", s2h: "", s3p: "", s3h: "",  // edge stops
                  pc: "", hc: "", pw: 50, ph: 30, cx: 0.2, cy: 0.2, cxTol: 0, cyTol: 0 },    // pocket
        features: []
      };
    }

    function itemById(id) { return model.items.find(item => item.id === id); }

    function findFeature(fid) {
      for (const item of model.items) {
        const f = item.features.find(f => f.id === fid);
        if (f) return { f, item };
      }
      return null;
    }

    function toNumber(text) {
      const n = Number(text);
      return Number.isFinite(n) ? n : 0;
    }

    // ----- Editing functions, called by the inputs on the page -----

    function addItem() {
      const root = model.items.find(item => item.parent === null);
      model.items.push(newItem(t("newItemName") + " " + (model.items.length + 1), "part",
                               root ? root.id : null));
      render();
    }

    function removeItem(id) {
      if (model.items.some(item => item.parent === id)) {
        setMessages([{ type: "error", key: "errHasChildren", args: [itemById(id).name] }]);
        return;
      }
      model.items = model.items.filter(item => item.id !== id);
      render();
    }

    function setItem(id, field, value) {
      itemById(id)[field] = value;
      render();
    }

    function setParent(id, parentId) {
      const item = itemById(id);
      item.parent = parentId || null;
      // Features on the old parent (pins, stops, pocket) don't apply any more.
      for (const field of ["p1", "p2", "s1p", "s2p", "s3p", "pc"]) item.locate[field] = "";
      render();
    }

    function setLocate(id, field, value, isNumber) {
      const item = itemById(id);
      item.locate[field] = isNumber ? toNumber(value) : value;
      if (field === "method" && value === "known" && !item.locate.pivot && item.features.length) {
        item.locate.pivot = item.features[0].id;
      }
      if (!isNumber) render();
      else updateStructure();
    }

    function addFeature(itemId) {
      const item = itemById(itemId);
      item.features.push(newFeature(t("newFeatureName") + (item.features.length + 1), "point",
                                    0, 0, 0, 0, 0, 0, 0));
      render();
    }

    function removeFeature(fid) {
      const { item } = findFeature(fid);
      item.features = item.features.filter(f => f.id !== fid);
      render();
    }

    function setFeature(fid, field, value, isNumber) {
      findFeature(fid).f[field] = isNumber ? toNumber(value) : value;
      if (!isNumber) render();   // names and kinds appear in other dropdowns
      else updateStructure();    // (a full redraw here would lose the cursor position)
    }

    function addCheck() {
      model.checks.push({ id: uid("c"), name: t("newCheckName") + " " + (model.checks.length + 1),
                          p: "", q: "", measure: "dx", min: null, max: null });
      render();
    }

    function removeCheck(id) {
      model.checks = model.checks.filter(c => c.id !== id);
      render();
    }

    // kind: "text" (name), "select" (dropdowns) or "spec" (number, empty = no limit)
    function setCheck(id, field, value, kind) {
      const check = model.checks.find(c => c.id === id);
      // Switching to or from Fit: From/To become items instead of features, and the
      // spec becomes "margin ≥ 0".
      if (field === "measure" && (value === "fit") !== (check.measure === "fit")) {
        check.p = "";
        check.q = "";
        check.min = value === "fit" ? 0 : null;
        check.max = null;
      }
      if (kind === "spec") check[field] = value === "" ? null : toNumber(value);
      else check[field] = value;
      if (kind === "select") render();
      else updateStructure();
    }

    // =====================================================================
    // SAVING AND OPENING PROJECTS
    // =====================================================================

    function isDirty() {
      return cleanSnapshot === null || JSON.stringify(model) !== cleanSnapshot;
    }

    // Everything that goes into a project file.
    function projectData() {
      return {
        app: "assembly-tolerance",
        version: 1,
        savedAt: new Date().toISOString(),
        settings: {
          runs: Number(document.getElementById("runs").value),
          sigmaLevel: Number(document.getElementById("sigmaLevel").value)
        },
        model
      };
    }

    // Automatic save in this browser. Called after every change.
    function saveToBrowser() {
      if (!canStore || !model) return;
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign(projectData(), { clean: !isDirty() })));
      } catch (e) {}
    }

    function fileName() {
      // Remove characters a file name can't have, then tidy the spaces.
      const base = (model.name || "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
      return (base || "assembly-project") + ".json";
    }

    // "Save project file". On a phone it opens the share sheet ("Save to Files", or send
    // it by chat or e-mail); on a computer the browser downloads the .json file.
    async function saveProjectFile() {
      const text = JSON.stringify(projectData(), null, 2);
      const name = fileName();
      const file = new File([text], name, { type: "application/json" });
      const isPhone = window.matchMedia("(pointer: coarse)").matches;
      if (isPhone && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          markSaved("sharedFile", name);
        } catch (e) {
          if (e.name !== "AbortError") downloadFile(text, name);   // sharing failed: download instead
        }
        return;
      }
      downloadFile(text, name);
    }

    function downloadFile(text, name) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      markSaved("savedFile", name);
    }

    function markSaved(messageKey, name) {
      cleanSnapshot = JSON.stringify(model);
      saveToBrowser();
      setMessages([{ type: "info", key: messageKey, args: [name] }]);
    }

    // "Open project file": read the chosen file and replace the current setup.
    function openProjectFile(input) {
      const file = input.files[0];
      input.value = "";   // so the same file can be chosen again later
      if (!file) return;
      if (isDirty() && !confirm(t("confirmReplace"))) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyProject(JSON.parse(reader.result));
          afterReplace();
          saveToBrowser();
          setMessages([{ type: "info", key: "openedFile", args: [file.name] }]);
        } catch (e) {
          setMessages([{ type: "error", key: "badFile", args: [file.name] }]);
        }
      };
      reader.readAsText(file);
    }

    // Puts a project (from a file or the browser) into the page. Throws if it isn't one.
    function applyProject(data) {
      if (!data || data.app !== "assembly-tolerance" || !data.model ||
          !Array.isArray(data.model.items) || !Array.isArray(data.model.checks)) {
        throw new Error("not a project file");
      }
      model = normalizeModel(data.model);
      const s = data.settings || {};
      if (Number.isInteger(s.runs)) document.getElementById("runs").value = s.runs;
      if (s.sigmaLevel === 3 || s.sigmaLevel === 6) document.getElementById("sigmaLevel").value = s.sigmaLevel;
    }

    // Checks and tidies a loaded model: fills in anything missing (for example from an
    // older file), turns numbers into numbers, and makes sure every id looks like ours
    // ("i3", "f12", "c2") so nothing strange can get into the page.
    function normalizeModel(raw) {
      const okId = (id, prefix) => {
        if (typeof id !== "string" || !new RegExp("^" + prefix + "\\d+$").test(id)) throw new Error("bad id");
        return id;
      };
      const numbers = (obj, keys) => { for (const k of keys) obj[k] = toNumber(obj[k]); return obj; };
      const text = v => String(v ?? "");
      const blank = newItem("", "part", null).locate;

      const items = raw.items.map(it => {
        const L = numbers(Object.assign({}, blank, it.locate),
                          ["tx", "ty", "tt", "pw", "ph", "cx", "cy", "cxTol", "cyTol"]);
        for (const k of ["p1", "h1", "p2", "h2", "pivot", "s1p", "s1h", "s2p", "s2h", "s3p", "s3h", "pc", "hc"]) {
          L[k] = text(L[k]);
        }
        if (!["twoPin", "pattern", "stops", "pocket", "known"].includes(L.method)) L.method = "twoPin";
        if (!["free", "tight"].includes(L.mode)) L.mode = "free";
        if (!["+x", "-x", "+y", "-y"].includes(L.n1)) L.n1 = "-y";
        if (!["+x", "-x", "+y", "-y"].includes(L.n2)) L.n2 = "-x";
        return {
          id: okId(it.id, "i"),
          name: text(it.name),
          type: it.type === "fixture" ? "fixture" : "part",
          parent: it.parent ? okId(it.parent, "i") : null,
          locate: L,
          features: (it.features || []).map(f => numbers({
            id: okId(f.id, "f"),
            name: text(f.name),
            kind: ["hole", "pin", "point"].includes(f.kind) ? f.kind : "point",
            x: f.x, y: f.y, d: f.d, dTol: f.dTol, tolX: f.tolX, tolY: f.tolY, tp: f.tp
          }, ["x", "y", "d", "dTol", "tolX", "tolY", "tp"]))
        };
      });
      const spec = v => v === null || v === undefined || v === "" ? null : toNumber(v);
      const checks = raw.checks.map(c => ({
        id: okId(c.id, "c"),
        name: text(c.name),
        p: text(c.p),
        q: text(c.q),
        measure: ["dx", "dy", "radial", "fit"].includes(c.measure) ? c.measure : "dx",
        min: spec(c.min),
        max: spec(c.max)
      }));

      // New ids must not clash with the loaded ones.
      let biggest = 0;
      for (const item of items) {
        biggest = Math.max(biggest, Number(item.id.slice(1)), ...item.features.map(f => Number(f.id.slice(1))));
      }
      for (const c of checks) biggest = Math.max(biggest, Number(c.id.slice(1)));
      nextId = biggest + 1;

      return { name: text(raw.name), description: text(raw.description), items, checks };
    }

    // "New empty project": just one base fixture.
    function newProject() {
      if (isDirty() && !confirm(t("confirmReplace"))) return;
      nextId = 1;
      model = { name: "", description: "", items: [newItem(t("newFixture"), "fixture", null)], checks: [] };
      afterReplace();
    }

    // After the whole setup is replaced: clear old results and remember it as "saved".
    function afterReplace() {
      patternForm = null;
      lastResults = null;
      document.getElementById("results").innerHTML = "";
      document.getElementById("legend").style.display = "none";
      setMessages([]);
      cleanSnapshot = JSON.stringify(model);
      render();
    }

    function toggleView() {
      fullView = !fullView;
      try { localStorage.setItem("assemblyFullView", fullView ? "1" : "0"); } catch (e) {}
      render();
    }

    // ----- "+ Add pattern": create a whole row or rectangle of holes/pins at once -----

    function openPatternForm(itemId) {
      patternForm = {
        itemId, shape: "rect", kind: "hole", prefix: "H-", d: 3.05, tolX: 0, tolY: 0,
        x: 0, y: 0, w: 100, h: 60, nx: 3, px: 20, ny: 2, py: 20,   // rectangle
        dir: "x", pitch: 10, count: 5,                              // single row
        mate: itemById(itemId).parent !== null,                     // matching features on the parent
        matePrefix: "P-", mateD: 3, mateTolX: 0, mateTolY: 0,
        setMethod: true
      };
      render();
    }

    function closePatternForm() {
      patternForm = null;
      render();
    }

    function setPatternField(field, value, isNumber) {
      patternForm[field] = isNumber ? toNumber(value) : value;
      if (!isNumber) render();   // shape, kind and checkboxes change what the form shows
    }

    // The positions of a pattern, each with a suffix for its name:
    //   rectangle: T1, T2 … (top row), B… (bottom), L… (left), R… (right)
    //   single row: 1, 2, 3 …
    function patternPoints(s) {
      const round = v => Math.round(v * 1e6) / 1e6;   // avoids numbers like 0.30000000000000004
      const pts = [];
      const add = (suffix, x, y) => pts.push({ suffix, x: round(x), y: round(y) });
      if (s.shape === "row") {
        for (let i = 0; i < s.count; i++) {
          add(String(i + 1), s.x + (s.dir === "x" ? i * s.pitch : 0), s.y + (s.dir === "y" ? i * s.pitch : 0));
        }
        return pts;
      }
      // Each row is centered on the rectangle's center.
      const offset = (i, n, pitch) => (i - (n - 1) / 2) * pitch;
      for (let i = 0; i < s.nx; i++) add("T" + (i + 1), s.x + offset(i, s.nx, s.px), s.y + s.h / 2);
      for (let i = 0; i < s.nx; i++) add("B" + (i + 1), s.x + offset(i, s.nx, s.px), s.y - s.h / 2);
      for (let i = 0; i < s.ny; i++) add("L" + (i + 1), s.x - s.w / 2, s.y + offset(i, s.ny, s.py));
      for (let i = 0; i < s.ny; i++) add("R" + (i + 1), s.x + s.w / 2, s.y + offset(i, s.ny, s.py));
      return pts;
    }

    function createPattern() {
      const s = patternForm;
      const whole = n => Number.isInteger(n) && n >= 0 && n <= 200;
      const ok = s.shape === "row" ? whole(s.count) : whole(s.nx) && whole(s.ny);
      const pts = ok ? patternPoints(s) : [];
      if (pts.length === 0) {
        setMessages([{ type: "error", key: "errPatternForm", args: [] }]);
        return;
      }
      const item = itemById(s.itemId);
      for (const p of pts) {
        item.features.push(newFeature(s.prefix + p.suffix, s.kind, p.x, p.y, s.d, 0, s.tolX, s.tolY, 0));
      }
      const withMate = s.mate && item.parent !== null;
      if (withMate) {
        const parent = itemById(item.parent);
        const mateKind = s.kind === "hole" ? "pin" : "hole";
        for (const p of pts) {
          parent.features.push(newFeature(s.matePrefix + p.suffix, mateKind, p.x, p.y,
                                          s.mateD, 0, s.mateTolX, s.mateTolY, 0));
        }
        if (s.setMethod) {
          if (item.locate.method !== "pattern") item.locate.mode = "tight";
          item.locate.method = "pattern";
        }
      }
      patternForm = null;
      setMessages([{ type: "info", key: "patternMade", args: [pts.length * (withMate ? 2 : 1)] }]);
      render();
    }

    // Pin pattern pairing: each hole (or pin) on the item is paired with a pin (or hole)
    // on the parent at exactly the same nominal X / Y.
    function patternPairs(item, parent) {
      if (!parent) return [];
      const pairs = [];
      for (const h of item.features) {
        if (h.kind === "point") continue;
        const p = parent.features.find(p => p.kind !== "point" && p.kind !== h.kind &&
                                            Math.hypot(p.x - h.x, p.y - h.y) < 1e-6);
        if (p) pairs.push({ p: p.id, h: h.id });
      }
      return pairs;
    }

    // Fit check pairing: each hole/pin on the moving item (check.p) is paired with a
    // pin/hole at the same nominal X / Y on the target item (check.q), or on any other
    // item except the moving item's parent (check.q = "*").
    function fitPairs(check) {
      const moving = itemById(check.p);
      if (!moving) return [];
      const targets = check.q === "*"
        ? model.items.filter(i => i.id !== moving.id && i.id !== moving.parent)
        : [itemById(check.q)].filter(Boolean);
      const pairs = [];
      for (const fA of moving.features) {
        if (fA.kind === "point") continue;
        for (const target of targets) {
          const fB = target.features.find(f => f.kind !== "point" && f.kind !== fA.kind &&
                                               Math.hypot(f.x - fA.x, f.y - fA.y) < 1e-6);
          if (fB) { pairs.push({ fA, fB, itemA: moving, itemB: target }); break; }
        }
      }
      return pairs;
    }

    // =====================================================================
    // DRAWING THE EDITOR (items, features, checks)
    // =====================================================================

    // Builds <option> tags. list = [{ value, label }]
    function options(list, selected) {
      return list.map(o =>
        `<option value="${esc(o.value)}"${o.value === selected ? " selected" : ""}>${esc(o.label)}</option>`
      ).join("");
    }

    function featureOptions(item, selected) {
      const list = [{ value: "", label: t("choose") }];
      if (item) for (const f of item.features) list.push({ value: f.id, label: f.name });
      return options(list, selected);
    }

    // All features of all items, grouped by item (for the checks table).
    function allFeatureOptions(selected) {
      return options([{ value: "", label: t("choose") }], selected) +
        model.items.map(item =>
          `<optgroup label="${esc(item.name)}">` +
          options(item.features.map(f => ({ value: f.id, label: f.name })), selected) +
          `</optgroup>`
        ).join("");
    }

    // Items for a Fit check: the moving item, and what it fits onto.
    function itemOptions(selected, withAll) {
      const list = [{ value: "", label: t("choose") }];
      if (withAll) list.push({ value: "*", label: t("allOthers") });
      for (const item of model.items) list.push({ value: item.id, label: item.name });
      return options(list, selected);
    }

    // Items in tree order (parents before children), with their depth for indenting.
    function treeOrder() {
      const out = [];
      const seen = new Set();
      function visit(item, depth) {
        if (seen.has(item.id)) return;
        seen.add(item.id);
        out.push({ item, depth });
        model.items.filter(c => c.parent === item.id).forEach(c => visit(c, depth + 1));
      }
      model.items.filter(item => item.parent === null).forEach(root => visit(root, 0));
      model.items.forEach(item => visit(item, 0));   // anything left over (a broken chain)
      return out;
    }

    // All items below this one in the tree (an item can't sit on its own child).
    function descendants(id) {
      const result = new Set();
      const walk = pid => model.items.filter(c => c.parent === pid).forEach(c => {
        if (!result.has(c.id)) { result.add(c.id); walk(c.id); }
      });
      walk(id);
      return result;
    }

    function render() {
      document.getElementById("viewButton").textContent = t(fullView ? "viewSimple" : "viewFull");
      document.getElementById("projectName").value = model.name || "";
      const description = document.getElementById("description");
      description.value = model.description || "";
      fitHeight(description);
      updateStructure();
      document.getElementById("items").innerHTML =
        treeOrder().map(({ item, depth }) => itemCard(item, depth)).join("");
      document.getElementById("checks").innerHTML = checksTable();
    }

    // Makes a text box exactly as tall as its text.
    function fitHeight(box) {
      box.style.height = "auto";
      box.style.height = box.scrollHeight + 4 + "px";
    }

    // Every edit ends up here (directly or through render), so this is also where the
    // automatic browser save happens.
    function updateStructure() {
      document.getElementById("structure").textContent = structureText();
      saveToBrowser();
    }

    // The "Assembly structure" overview, as text with tree lines, e.g.
    //   Carrier (fixture)
    //    ├─ Part A (part)  ← 2 pins, free (PA1/HA1, PA2/HA2)
    //    └─ Align block (fixture)  ← 2 pins, free (...)
    //        └─ Part B (part)  ← 2 pins, free (...)
    function structureText() {
      const lines = [];
      const fname = id => { const r = findFeature(id); return r ? r.f.name : "?"; };
      const mode = L => t(L.mode === "free" ? "modeFreeShort" : "modeTightShort");
      const summary = item => {
        const L = item.locate;
        if (L.method === "known") return t("sumKnown", L.tx, L.ty, L.tt);
        if (L.method === "pattern") return t("sumPattern", mode(L), patternPairs(item, itemById(item.parent)).length);
        if (L.method === "stops") return t("sumStops", L.n1.toUpperCase(), L.n2.toUpperCase());
        if (L.method === "pocket") return t("sumPocket", L.cx, L.cy);
        return t("sumTwoPin", mode(L), `${fname(L.p1)}/${fname(L.h1)}, ${fname(L.p2)}/${fname(L.h2)}`);
      };
      const visit = (item, prefix, last, isRoot) => {
        const type = t(item.type === "part" ? "typePartShort" : "typeFixtureShort");
        lines.push((isRoot ? "" : prefix + (last ? "└─ " : "├─ ")) + `${item.name} (${type})` +
                   (isRoot ? "" : "  ← " + summary(item)));
        const kids = model.items.filter(c => c.parent === item.id);
        const next = isRoot ? " " : prefix + (last ? "   " : "│  ");
        kids.forEach((k, i) => visit(k, next, i === kids.length - 1, false));
      };
      model.items.filter(item => item.parent === null).forEach(root => visit(root, "", true, true));

      if (model.checks.length) {
        lines.push("", t("checksTitle") + ":");
        const end = r => r ? `${r.item.name} / ${r.f.name}` : "?";
        for (const c of model.checks) {
          if (c.measure === "fit") {
            const name = id => id === "*" ? t("allOthers") : (itemById(id) || { name: "?" }).name;
            lines.push(`  • ${c.name}: ${name(c.p)} ⇄ ${name(c.q)} ` +
                       `(${measureLabel(c.measure)}, ${t("fitPairsShort", fitPairs(c).length)})`);
            continue;
          }
          lines.push(`  • ${c.name}: ${end(findFeature(c.p))} → ${end(findFeature(c.q))} (${measureLabel(c.measure)})`);
        }
      }
      return lines.join("\n");
    }

    function itemCard(item, depth) {
      const below = descendants(item.id);
      const parentChoices = [{ value: "", label: t("noneRoot") }].concat(
        model.items.filter(o => o.id !== item.id && !below.has(o.id))
                   .map(o => ({ value: o.id, label: o.name })));
      const id = item.id;

      return `
        <div class="item-card ${item.type}" style="margin-left:${Math.min(depth, 4) * 20}px">
          <div class="row">
            <label>${t("itemName")}
              <input value="${esc(item.name)}" onchange="setItem('${id}','name',this.value)">
            </label>
            <label>${t("itemType")}
              <select onchange="setItem('${id}','type',this.value)">
                ${options([{ value: "fixture", label: t("typeFixture") },
                           { value: "part", label: t("typePart") }], item.type)}
              </select>
            </label>
            <label>${t("locatedOn")}
              <select onchange="setParent('${id}',this.value)">
                ${options(parentChoices, item.parent || "")}
              </select>
            </label>
            <div><button class="small danger" onclick="removeItem('${id}')">${t("remove")}</button></div>
          </div>
          ${item.parent ? locateEditor(item) : `<p class="note">${t("rootNote")}</p>`}
          <h3>${t("features")}</h3>
          <div class="table-wrap">${featureTable(item)}</div>
          ${patternForm && patternForm.itemId === id ? patternFormHtml(item) : ""}
          <button class="small" onclick="addFeature('${id}')">${t("addFeature")}</button>
          <button class="small" onclick="openPatternForm('${id}')">${t("addPattern")}</button>
        </div>`;
    }

    function locateEditor(item) {
      const L = item.locate;
      const parent = itemById(item.parent);
      const id = item.id;
      const methodSelect = `
        <label>${t("locateMethod")}
          <select onchange="setLocate('${id}','method',this.value)">
            ${options([{ value: "twoPin", label: t("methodTwoPin") },
                       { value: "pattern", label: t("methodPattern") },
                       { value: "stops", label: t("methodStops") },
                       { value: "pocket", label: t("methodPocket") },
                       { value: "known", label: t("methodKnown") }], L.method)}
          </select>
        </label>`;

      if (L.method === "known") {
        const num = (field, label) => `
          <label>${label}
            <input type="number" step="any" min="0" value="${L[field]}"
                   onchange="setLocate('${id}','${field}',this.value,true)">
          </label>`;
        return `
          <div class="locate">
            <div class="row">${methodSelect}
              <label>${t("pivot")}
                <select onchange="setLocate('${id}','pivot',this.value)">${featureOptions(item, L.pivot)}</select>
              </label>
            </div>
            <div class="row">${num("tx", t("knownX"))}${num("ty", t("knownY"))}${num("tt", t("knownT"))}</div>
          </div>`;
      }

      // Edge stops: three rows (stop on the parent <-> edge point on this item).
      if (L.method === "stops") {
        const dirs = ["+x", "-x", "+y", "-y"].map(d => ({ value: d, label: d.toUpperCase() }));
        const stop = (label, pf, hf) => `
          <tr>
            <td class="pair-label">${label}</td>
            <td><select onchange="setLocate('${id}','${pf}',this.value)">${featureOptions(parent, L[pf])}</select></td>
            <td><select onchange="setLocate('${id}','${hf}',this.value)">${featureOptions(item, L[hf])}</select></td>
          </tr>`;
        return `
          <div class="locate">
            <div class="row">${methodSelect}
              <label>${t("pushPrimary")}
                <select onchange="setLocate('${id}','n1',this.value)">${options(dirs, L.n1)}</select>
              </label>
              <label>${t("pushSecondary")}
                <select onchange="setLocate('${id}','n2',this.value)">${options(dirs, L.n2)}</select>

              <table>
                <tr><th></th><th>${esc(t("onParentStop", parent ? parent.name : "?"))}</th>
                    <th>${esc(t("onSelfEdge", item.name))}</th></tr>
                ${stop(t("stop1"), "s1p", "s1h")}${stop(t("stop2"), "s2p", "s2h")}${stop(t("stop3"), "s3p", "s3h")}
              </table>
            </div>
            <p class="note">${t("stopsNote")}</p>
          </div>`;
      }

      // Pocket: the part floats inside the pocket's clearance.
      if (L.method === "pocket") {
        const num = (field, label) => `
          <label>${label}
            <input type="number" step="any" min="0" value="${L[field]}"
                   onchange="setLocate('${id}','${field}',this.value,true)">
          </label>`;
        return `
          <div class="locate">
            <div class="row">${methodSelect}
              <label>${t("pocketCenter")}
                <select onchange="setLocate('${id}','pc',this.value)">${featureOptions(parent, L.pc)}</select>
              </label>
              <label>${t("partCenter")}
                <select onchange="setLocate('${id}','hc',this.value)">${featureOptions(item, L.hc)}</select>
              </label>
            </div>
            <div class="row">${num("pw", t("partSizeX"))}${num("ph", t("partSizeY"))}
                             ${num("cx", t("clearX"))}${num("cy", t("clearY"))}
                             ${num("cxTol", t("clearXTol"))}${num("cyTol", t("clearYTol"))}</div>
            <p class="note">${t("pocketNote")}</p>
          </div>`;
      }

      // Free / tight, used by both "two pins" and "pin pattern".
      const modeSelect = `
        <label>${t("floatMode")}
          <select onchange="setLocate('${id}','mode',this.value)">
            ${options([{ value: "free", label: t("modeFree") },
                       { value: "tight", label: t("modeTight") }], L.mode)}
          </select>
        </label>`;

      // Pin pattern: the pairs are found automatically, so we just list them.
      if (L.method === "pattern") {
        const pairs = patternPairs(item, parent);
        const fname = fid => findFeature(fid).f.name;
        const list = pairs.slice(0, 8).map(pr => `${fname(pr.h)}↔${fname(pr.p)}`).join(", ") +
                     (pairs.length > 8 ? ", …" : "");
        const text = pairs.length < 2 ? t("patternNeed", parent ? parent.name : "?")
                                      : t("patternPairs", pairs.length, list);
        return `
          <div class="locate">
            <div class="row">${methodSelect}${modeSelect}</div>
            <p class="note ${pairs.length < 2 ? "error" : ""}">${esc(text)}</p>
          </div>`;
      }

      // Two pins: one row per pin pair (feature on the parent <-> feature on this item)
      const pair = (label, pf, hf) => `
        <tr>
          <td class="pair-label">${label}</td>
          <td><select onchange="setLocate('${id}','${pf}',this.value)">${featureOptions(parent, L[pf])}</select></td>
          <td><select onchange="setLocate('${id}','${hf}',this.value)">${featureOptions(item, L[hf])}</select></td>
        </tr>`;
      return `
        <div class="locate">
          <div class="row">${methodSelect}${modeSelect}</div>
          <div class="table-wrap">
            <table>
              <tr><th></th><th>${esc(t("onParent", parent ? parent.name : "?"))}</th>
                  <th>${esc(t("onSelf", item.name))}</th></tr>
              ${pair(t("pair1"), "p1", "h1")}
              ${pair(t("pair2"), "p2", "h2")}
            </table>
          </div>
        </div>`;
    }

    // Simple view: Name, Kind, X, Y, Ø, ±X, ±Y.   Full view adds ±Ø and ⌀ Position.
    function featureTable(item) {
      const cols = fullView
        ? ["colName", "colKind", "colX", "colY", "colD", "colDTol", "colTolX", "colTolY", "colTP"]

                    onchange="setFeature('${f.id}','${field}',this.value,true)"></td>`;

            <td>${hidden ? `<span class="hidden-mark" title="${esc(t("hiddenMark"))}">●</span>` : ""}</td>

             (anyHidden ? `<p class="note"><span class="hidden-mark">●</span> ${t("hiddenMark")}</p>` : "");

    function checksTable() {

      const rows = model.checks.map(c => `

            ${c.measure === "fit" ? itemOptions(c.p, false) : allFeatureOptions(c.p)}</select></td>
          <td><select onchange="setCheck('${c.id}','q',this.value,'select')">
            ${c.measure === "fit" ? itemOptions(c.q, true) : allFeatureOptions(c.q)}</select></td>

            ${options([{ value: "dx", label: "ΔX" }, { value: "dy", label: "ΔY" },

                     ${c.measure === "fit" ? "disabled" : ""}
